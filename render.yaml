# Render blueprint: one Docker web service (API + built frontend on the same
# origin) backed by a managed Postgres database.
#
# Deploy: push this branch, then in the Render dashboard use
# "New > Blueprint" and point it at render.yaml.
# NOTE: Render's free Postgres expires after 30 days. For a permanent
# database, change the database plan below to a paid instance.

databases:
  - name: hero-realms-db
    databaseName: hero_realms
    user: hero_realms
    plan: free

services:
  - type: web
    name: hero-realms
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hero-realms-db
          property: connectionString
      - key: COOKIE_SECURE
        value: "1"
      # PORT is injected by Render automatically; the backend binds 0.0.0.0
      # whenever PORT is set.
