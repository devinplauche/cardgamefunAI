name: CI

on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pytest numpy gymnasium
      # test_selfplay.py needs sb3_contrib + torch (heavy ML stack, not installed
      # here); test_value_net.py needs models_value/value_net_v1.npz, a gitignored
      # trained-weights artifact that is not in the repo. Both are excluded until
      # those environments are available.
      - name: Run test suite
        run: python -m pytest tests/ -q -p no:cacheprovider --ignore=tests/test_selfplay.py --ignore=tests/test_value_net.py

  perf:
    # Performance SLO tests: assert p95/p99 latencies for user-facing
    # endpoints. Catches regressions like the 2026-09-17 DB connection
    # issue (1s+ per tap from fresh Postgres handshakes). Runs against a
    # local backend with SQLite; production with Neon should meet the
    # same SLOs once connection pooling is in place.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pytest
      - name: Run perf SLO tests
        run: python -m pytest web/tests/test_perf_slo.py -v -p no:cacheprovider

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Typecheck
        working-directory: web
        run: npm run check
      - name: Build
        working-directory: web
        run: npm run build

  deploy:
    needs: [python-tests, frontend]
    # Only deploy merged pushes to main, never PRs.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/836373077810/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@hero-realms-game.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy to Cloud Run
        run: >
          gcloud run deploy hero-realms --source . --region=us-central1
          --project=hero-realms-game --allow-unauthenticated
          --memory 512Mi --cpu 1 --max-instances 3 --quiet

  e2e:
    # Live-site GUI suite (all 55 cards). Runs ONLY after a real deployment.
    # The card rig deals hands through the backend's debug-setup endpoint, so
    # the job enables HR_DEBUG_SETUP=1 for the test window, then reverts it
    # even if the tests fail.
    #
    # The rig runs on a TAGGED revision (e2e---<service-url>), never on live
    # traffic: `services update` creates a new revision but live traffic keeps
    # flowing to the old one (traffic pins survive deploys, and rollouts are
    # gradual), so pointing the tests at the live URL is racy by design. The
    # tag routes deterministically to the rig revision no matter what live
    # traffic is doing, and real users never touch the debug endpoint.
    needs: [deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/836373077810/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@hero-realms-game.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Enable e2e rig on Cloud Run
        run: |
          gcloud run services update hero-realms --region=us-central1 \
            --project=hero-realms-game --update-env-vars HR_DEBUG_SETUP=1 \
            --max-instances 1 --quiet
          REV=$(gcloud run services describe hero-realms --region=us-central1 \
            --project=hero-realms-game \
            --format="value(status.latestCreatedRevisionName)")
          gcloud run services update-traffic hero-realms --region=us-central1 \
            --project=hero-realms-game --set-tags "e2e=$REV" --to-tags e2e=0 --quiet
          echo "e2e rig revision $REV tagged at https://e2e---hero-realms-yokyhjajxq-uc.a.run.app"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Wait for e2e rig revision
        # The tagged revision needs a minute to roll out; fail fast here with
        # a clear line instead of letting every spec time out one by one.
        # 10-minute timeout: Cloud Run can be slow to provision a new revision
        # with a fresh tag, especially under load.
        run: |
          for i in $(seq 1 60); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 \
              https://e2e---hero-realms-yokyhjajxq-uc.a.run.app/api/health || true)
            if [ "$CODE" = "200" ]; then echo "rig revision serving"; exit 0; fi
            if [ $((i % 6)) -eq 0 ]; then echo "waiting for rig... attempt $i/60 (last HTTP $CODE)"; fi
            sleep 10
          done
          echo "e2e rig revision never became ready after 10 minutes" >&2
          echo "--- revision status ---" >&2
          gcloud run revisions list --service=hero-realms --region=us-central1 \
            --project=hero-realms-game --limit=3 \
            --format="table(name,creationTimestamp)" >&2 || true
          exit 1
      - name: Run card GUI suite
        working-directory: web
        run: npx playwright test
        env:
          E2E_BASE_URL: https://e2e---hero-realms-yokyhjajxq-uc.a.run.app
      - name: Disable e2e rig on Cloud Run
        if: always()
        run: |
          gcloud run services update-traffic hero-realms --region=us-central1 \
            --project=hero-realms-game --remove-tags e2e --quiet
          gcloud run services update hero-realms --region=us-central1 \
            --project=hero-realms-game --remove-env-vars HR_DEBUG_SETUP \
            --max-instances 3 --quiet
